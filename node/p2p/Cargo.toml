[package]
name = "crypto-coin-p2p"
version = "0.1.0"
edition = "2021"
description = "P2P networking layer for Crypto_Coin blockchain"
authors = ["Crypto_Coin Team <core@crypto-coin.io>"]
license = "MIT"
repository = "https://github.com/crypto-coin/p2p"

[dependencies]
tokio = { version = "1", features = ["full"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

