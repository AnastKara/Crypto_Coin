[package]
name = "crypto-coin-api"
version = "0.1.0"
edition = "2021"
description = "JSON-RPC and WebSocket API for Crypto_Coin blockchain node"
authors = ["Crypto_Coin Team <core@crypto-coin.io>"]
license = "MIT"
repository = "https://github.com/crypto-coin/api"

[dependencies]
tokio = { version = "1", features = ["full"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

