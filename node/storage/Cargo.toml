[package]
name = "crypto-coin-storage"
version = "0.1.0"
edition = "2021"
description = "Blockchain storage layer for Crypto_Coin"
authors = ["Crypto_Coin Team <core@crypto-coin.io>"]
license = "MIT"
repository = "https://github.com/crypto-coin/storage"

[dependencies]
tokio = { version = "1", features = ["full"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

