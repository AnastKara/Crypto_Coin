[package]
name = "crypto-coin-signatures"
version = "0.1.0"
edition = "2021"
description = "Ed25519 digital signature library for Crypto_Coin blockchain"
authors = ["Crypto_Coin Team <core@crypto-coin.io>"]
license = "MIT"
repository = "https://github.com/crypto-coin/signatures"

[dependencies]
ed25519-dalek = "2"
rand = "0.8"
sha2 = "0.10"
blake2 = "0.10"
hkdf = "0.12"
hex = "0.4"
typenum = "1"
generic-array = "0.14"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

